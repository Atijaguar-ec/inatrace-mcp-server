[project]
name = "inatrace-mcp-server"
version = "1.0.0"
description = "INATrace MCP Server: Oráculo de trazabilidad, cumplimiento regulatorio Ecuador-UE (EUDR / LOPDP) e interoperabilidad institucional"
authors = [{ name = "Álvaro Geovani Sánchez Correa", email = "alvaro.sanchez@atijaguar.com" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "numpy>=1.26.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "coverage>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/healthcheck.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Umbral por debajo de la cobertura actual (ver README) para impedir regresiones
# sin volver frágil la compuerta. Subirlo exige cubrir init_db_pool, que necesita
# un PostgreSQL real y se verifica con tests/verify_staging_live.py.
fail_under = 75
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
